        /* Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        /* Container Layout */
        .wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        /* Background Image Slider */
        .slider-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .bg-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        .bg-slide.active {
            opacity: 1;
        }

        /* Dark Overlay for readability */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            z-index: 2;
        }

        /* Main Content Overlay Area */
        .content-area {
            position: relative;
            z-index: 3;
            width: 90%;
            max-width: 800px;
            margin: auto;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 70vh;
        }

        /* Stage 1 Content */
        #stage1 {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .glowing-title {
            font-size: 2.2rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.3;
            background: linear-gradient(90deg, #fff 0%, #ff007f 25%, #00f0ff 50%, #ff007f 75%, #fff 100%);
            background-size: 200% auto;
            color: #fff;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite, pulseGlow 2s ease-in-out infinite alternate;
            text-shadow: 0 0 20px rgba(255, 0, 127, 0.6), 0 0 40px rgba(0, 240, 255, 0.4);
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.98); }
            100% { transform: scale(1.02); }
        }

        /* Action Button */
        .cta-button {
            margin-top: 30px;
            padding: 16px 36px;
            font-size: 1.5rem;
            font-weight: 800;
            color: #fff;
            background: linear-gradient(135deg, #111, #222);
            border: 3px solid #ff007f;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.8), inset 0 0 10px rgba(255, 0, 127, 0.5);
            display: none;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInBtn 0.5s forwards, wobble 2.5s infinite ease-in-out 0.5s;
        }

        @keyframes fadeInBtn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes wobble {
            0%, 100% { transform: scale(1) rotate(0deg); }
            15% { transform: scale(1.08) rotate(-3deg); }
            30% { transform: scale(1.08) rotate(3deg); }
            45% { transform: scale(1.05) rotate(-2deg); }
            60% { transform: scale(1.05) rotate(2deg); }
            75% { transform: scale(1) rotate(0deg); }
        }

        /* Custom Locanto Styling inside button */
        .locanto-text {
            font-weight: 900;
            display: inline-block;
        }
        .locanto-lo { color: #0044ff; }
        .locanto-can { color: #ff8800; }
        .locanto-to { color: #ff3300; }

        /* Fake Buffering Spinner */
        #loader {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .spinner {
            width: 65px;
            height: 65px;
            border: 6px solid rgba(255, 255, 255, 0.2);
            border-top: 6px solid #ff007f;
            border-right: 6px solid #00f0ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Stage 2 Content */
        #stage2 {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .stage2-text {
            font-size: 1.6rem;
            color: #ffffff;
            font-weight: 700;
            line-height: 1.5;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
        }

        .highlight-free {
            color: #00ffcc;
            font-size: 1.8rem;
            font-weight: 900;
            display: inline-block;
            text-decoration: underline;
            animation: bounceShake 1.2s infinite alternate;
            text-shadow: 0 0 15px #00ffcc;
        }

        @keyframes bounceShake {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-5px) scale(1.1); color: #ff007f; text-shadow: 0 0 15px #ff007f; }
        }

        .loading-text {
            margin-top: 25px;
            font-size: 1.2rem;
            color: #ffcc00;
            font-style: italic;
            font-weight: 600;
            display: none;
            animation: pulseFade 1.5s infinite;
        }

        @keyframes pulseFade {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* Footer */
        .footer {
            position: relative;
            z-index: 3;
            width: 100%;
            padding: 15px 0;
            text-align: center;
            color: #bbbbbb;
            font-size: 0.9rem;
            background: rgba(0, 0, 0, 0.7);
        }

        /* Responsive Mobile Styling */
        @media (max-width: 600px) {
            .glowing-title {
                font-size: 1.4rem;
            }
            .cta-button {
                font-size: 1.1rem;
                padding: 14px 24px;
            }
            .stage2-text {
                font-size: 1.2rem;
            }
            .highlight-free {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
